<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PODLESSON — Kimcast</title><style>@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;600;800&display=swap');:root{--paper:#f5f2e9;--ink:#101010;--blue:#203dff;--yellow:#f7ef4d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px 'DM Sans',sans-serif}main{max-width:1150px;margin:auto;padding:25px 24px 90px}nav{display:flex;gap:12px;margin:20px 0 55px}nav a{padding:12px 20px;border:2px solid var(--ink);text-decoration:none;color:var(--ink);font-weight:800;background:#fff}nav a[aria-current]{background:var(--blue);color:#fff}h1{font-family:'Archivo Black',sans-serif;font-size:clamp(50px,11vw,130px);letter-spacing:-.075em;line-height:1;margin:0 0 25px}section{border:2px solid var(--ink);background:var(--yellow);padding:28px;box-shadow:7px 7px 0 var(--ink)}p{line-height:1.6}.intro{max-width:70ch;font-weight:600}.formats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:26px}.format{display:block;text-align:left;border:3px solid var(--ink);background:#fff;padding:24px;box-shadow:6px 6px 0 var(--ink);font:inherit;cursor:pointer;min-height:220px}.format strong{display:block;font:clamp(22px,3vw,34px) "Archivo Black",sans-serif;letter-spacing:-.045em;margin:0 0 12px}.format span{line-height:1.55;display:block}.format:hover,.format[aria-pressed="true"]{background:var(--yellow)}.format[aria-pressed="true"]{outline:4px solid var(--blue);outline-offset:3px}.choice{margin-top:28px;background:#fff;border:2px solid var(--ink);padding:22px}.choice[hidden]{display:none}button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}@media(max-width:650px){.formats{grid-template-columns:1fr}}</style></head><body><main><nav aria-label="Site pages"><a href="./">KIMCAST</a><a href="podlesson.html" aria-current="page">PODLESSON</a></nav><h1>PODLESSON<span style="color:var(--blue)">.</span></h1><section><h2>CHOOSE YOUR PODLESSON FORMAT</h2><p class="intro">A real podcast, not a pretend lesson. Choose a starting format; we’ll develop more formats later.</p><div class="formats" role="group" aria-label="Choose a PODLESSON format"><button class="format" data-format="The Showdown" aria-pressed="false"><strong>01 / THE SHOWDOWN</strong><span>Choose a category, then nominate 10–20 contenders — novels, films, albums, sports teams or anything else. Put them head-to-head, debate each pairing and crown a winner.</span></button><button class="format" data-format="The Deep Dive" aria-pressed="false"><strong>02 / THE DEEP DIVE</strong><span>Choose one thing and explore it section by section: an album track by track, a novel through its characters and themes, or a film through its scenes and ideas.</span></button><button class="format" data-format="The Magazine" aria-pressed="false"><strong>03 / THE MAGAZINE</strong><span>Build an episode from shorter features: rankings, favourite things, analysis, random segments, opinions, related artwork and clips. Choose and arrange your segments.</span></button></div><div id="choice" class="choice" hidden aria-live="polite"></div></section><script>document.querySelectorAll(".format").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll(".format").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));const choice=document.getElementById("choice");choice.hidden=false;choice.textContent="SELECTED FORMAT: "+button.dataset.format+". Next we’ll build the episode-planning process for this format."}));</script></main></body></html>
